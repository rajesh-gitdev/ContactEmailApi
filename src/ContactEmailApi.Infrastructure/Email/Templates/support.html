<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f4f6f8;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;"><tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">
      <tr><td style="background:#0b6e4f;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:600;">Support ticket {{TicketNumber}}</td></tr>
      <tr><td style="padding:28px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;line-height:1.6;">
          <tr><td style="padding:6px 0;color:#647684;width:120px;">From</td><td style="padding:6px 0;font-weight:600;">{{Name}}</td></tr>
          <tr><td style="padding:6px 0;color:#647684;">Email</td><td style="padding:6px 0;"><a href="mailto:{{Email}}" style="color:#0f4c81;">{{Email}}</a></td></tr>
          <tr><td style="padding:6px 0;color:#647684;">Category</td><td style="padding:6px 0;">{{Category}}</td></tr>
          <tr><td style="padding:6px 0;color:#647684;">Priority</td><td style="padding:6px 0;font-weight:600;">{{Priority}}</td></tr>
          <tr><td style="padding:6px 0;color:#647684;">Subject</td><td style="padding:6px 0;font-weight:600;">{{Subject}}</td></tr>
        </table>
        <div style="margin-top:18px;padding:16px;background:#f4f6f8;border-radius:6px;font-size:14px;line-height:1.6;white-space:pre-wrap;">{{Description}}</div>
      </td></tr>
      <tr><td style="padding:18px 28px;border-top:1px solid #eceff1;color:#90a4ae;font-size:12px;">Opened {{TimestampUtc}} UTC &middot; {{AppName}}</td></tr>
    </table>
  </td></tr></table>
</body></html>
