<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f4f6f8;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;"><tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">
      <tr><td style="background:#243b53;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:600;">Reset your password</td></tr>
      <tr><td style="padding:28px;">
        <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">Hi {{Name}}, we received a request to reset your password. This link expires in {{ExpiryMinutes}} minutes.</p>
        <p style="text-align:center;margin:24px 0;"><a href="{{ResetUrl}}" style="display:inline-block;padding:12px 28px;background:#0f4c81;color:#ffffff;border-radius:6px;text-decoration:none;font-weight:600;">Reset password</a></p>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#647684;">If the button doesn&rsquo;t work, copy and paste this URL: {{ResetUrl}}</p>
      </td></tr>
      <tr><td style="padding:18px 28px;border-top:1px solid #eceff1;color:#90a4ae;font-size:12px;">Sent {{TimestampUtc}} UTC &middot; {{AppName}}</td></tr>
    </table>
  </td></tr></table>
</body></html>
