<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f4f6f8;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">
        <tr><td style="background:#0f4c81;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:600;">New contact message</td></tr>
        <tr><td style="padding:28px;">
          <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">You received a new message via the website contact form.</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;line-height:1.6;">
            <tr><td style="padding:6px 0;color:#647684;width:120px;">Name</td><td style="padding:6px 0;font-weight:600;">{{Name}}</td></tr>
            <tr><td style="padding:6px 0;color:#647684;">Email</td><td style="padding:6px 0;"><a href="mailto:{{Email}}" style="color:#0f4c81;">{{Email}}</a></td></tr>
            <tr><td style="padding:6px 0;color:#647684;">Phone</td><td style="padding:6px 0;">{{PhoneNumber}}</td></tr>
            <tr><td style="padding:6px 0;color:#647684;">Subject</td><td style="padding:6px 0;font-weight:600;">{{Subject}}</td></tr>
            <tr><td style="padding:6px 0;color:#647684;">Reference</td><td style="padding:6px 0;">{{ReferenceCode}}</td></tr>
          </table>
          <div style="margin-top:18px;padding:16px;background:#f4f6f8;border-radius:6px;font-size:14px;line-height:1.6;white-space:pre-wrap;">{{Message}}</div>
        </td></tr>
        <tr><td style="padding:18px 28px;border-top:1px solid #eceff1;color:#90a4ae;font-size:12px;">Sent {{TimestampUtc}} UTC &middot; {{AppName}}</td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
