name: ContactEmailApi CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ContactEmailApi.sln

      - name: Build application
        run: dotnet build ContactEmailApi.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ContactEmailApi.sln --configuration Release --no-build
