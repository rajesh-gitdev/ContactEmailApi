name: ContactEmailApi CD

on:
  workflow_run:
    workflows: ["ContactEmailApi CI"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: [self-hosted, Windows, X64]

    steps:

      # ==========================================
      # 1. Download artifact from CI
      # ==========================================
      - name: Download artifact from CI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = "${{ github.repository }}"

          Write-Host "Repository: $repo"
          Write-Host "CI Run ID: $env:CI_RUN_ID"

          $url = "https://api.github.com/repos/$repo/actions/runs/$env:CI_RUN_ID/artifacts"

          Write-Host "Getting artifacts..."

          $response = Invoke-RestMethod `
            -Uri $url `
            -Headers $headers `
            -Method Get

          $artifact = $response.artifacts |
            Where-Object {
              $_.name -eq "ContactEmailApi" -and
              $_.expired -eq $false
            } |
            Select-Object -First 1

          if (-not $artifact) {
            Write-Error "ContactEmailApi artifact was not found."
            exit 1
          }

          Write-Host "Artifact found!"
          Write-Host "Artifact ID: $($artifact.id)"

          $deployPath = "C:\Deploy\ContactEmail.API"

          if (-not (Test-Path $deployPath)) {
            New-Item `
              -ItemType Directory `
              -Path $deployPath `
              -Force | Out-Null
          }

          $zipPath = "$deployPath\artifact.zip"

          Write-Host "Downloading artifact..."

          Invoke-WebRequest `
            -Uri $artifact.archive_download_url `
            -Headers $headers `
            -OutFile $zipPath

          Write-Host "Cleaning old deployment files..."

          Get-ChildItem $deployPath -Force |
            Where-Object { $_.Name -ne "artifact.zip" } |
            Remove-Item -Recurse -Force

          Write-Host "Extracting new artifact..."

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $deployPath `
            -Force

          Remove-Item $zipPath -Force

          Write-Host "Deployment files ready."

          Get-ChildItem $deployPath


      # ==========================================
      # 2. Unblock files
      # ==========================================
      - name: Unblock deployment files
        shell: powershell
        run: |

          $path = "C:\Deploy\ContactEmail.API"

          if (Test-Path $path) {

            Get-ChildItem $path -Recurse -Force |
              Unblock-File `
              -ErrorAction SilentlyContinue

            Write-Host "Files unblocked."
          }


      # ==========================================
      # 3. Stop IIS Application Pool
      # ==========================================
      - name: Stop IIS Application Pool
        shell: powershell
        run: |

          Import-Module WebAdministration

          Write-Host "Stopping ContactEmail.Api..."

          Stop-WebAppPool `
            -Name "ContactEmail.Api"

          Write-Host "Application Pool stopped."


      # ==========================================
      # 4. Verify deployment
      # ==========================================
      - name: Verify deployment
        shell: powershell
        run: |

          $path = "C:\Deploy\ContactEmail.API"

          Write-Host "Checking deployment directory..."

          if (-not (Test-Path $path)) {
            Write-Error "Deployment directory does not exist."
            exit 1
          }

          Get-ChildItem $path


      # ==========================================
      # 5. Start IIS Application Pool
      # ==========================================
      - name: Start IIS Application Pool
        shell: powershell
        run: |

          Import-Module WebAdministration

          Write-Host "Starting ContactEmail.Api..."

          Start-WebAppPool `
            -Name "ContactEmail.Api"

          Write-Host "Application Pool started."


      # ==========================================
      # 6. Verify IIS
      # ==========================================
      - name: Verify IIS Application Pool
        shell: powershell
        run: |

          Import-Module WebAdministration

          Write-Host "Checking IIS Application Pool..."

          Get-WebAppPoolState `
            -Name "ContactEmail.Api"
