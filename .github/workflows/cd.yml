name: ContactEmailApi CD

on:
  workflow_run:
    workflows: ["ContactEmailApi CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: [self-hosted, Windows, X64]

    steps:

      # 1. Download artifact produced by CI
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ContactEmailApi
          path: C:\Deploy\ContactEmail.API
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Verify artifact
      - name: Verify artifact
        shell: powershell
        run: |
          Write-Host "Checking deployment folder..."

          if (-not (Test-Path "C:\Deploy\ContactEmail.API")) {
              Write-Error "Deployment folder does not exist."
              exit 1
          }

          Get-ChildItem "C:\Deploy\ContactEmail.API"

      # 3. Stop IIS Application Pool
      - name: Stop IIS Application Pool
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Stopping IIS Application Pool..."

          Stop-WebAppPool -Name "ContactEmail.Api"

      # 4. Deploy
      - name: Deploy application
        shell: powershell
        run: |
          Write-Host "Deploying ContactEmailApi..."

          Get-ChildItem "C:\Deploy\ContactEmail.API"

      # 5. Start IIS Application Pool
      - name: Start IIS Application Pool
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Starting IIS Application Pool..."

          Start-WebAppPool -Name "ContactEmail.Api"

      # 6. Verify IIS
      - name: Verify IIS Application Pool
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Checking IIS Application Pool..."

          Get-WebAppPoolState -Name "ContactEmail.Api"
