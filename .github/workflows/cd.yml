name: ContactEmailApi CD

on:
  workflow_run:
    workflows: ["ContactEmailApi CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Ensure PowerShell can run scripts (no-fail)
        shell: powershell
        run: |
          try {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force
            Write-Host "Execution policy set to RemoteSigned for this process."
          } catch {
            Write-Warning "Unable to change PowerShell execution policy: $($_.Exception.Message)"
            Write-Warning "Continuing without changing execution policy. If scripts fail later, consider unblocking files or adjusting runner policy."
          }

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ContactEmailApi
          path: C:\Deploy\ContactEmail.API
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Unblock downloaded files (if any)
        shell: powershell
        run: |
          if (Test-Path 'C:\Deploy\ContactEmail.API') {
            Write-Host "Unblocking files under C:\Deploy\ContactEmail.API ..."
            Get-ChildItem 'C:\Deploy\ContactEmail.API' -Recurse -Force | Unblock-File -ErrorAction SilentlyContinue
            Write-Host "Unblock completed."
          } else {
            Write-Host "Deployment directory not found; skipping Unblock-File."
          }

      - name: Stop IIS Application Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "ContactEmail.Api"

      - name: Verify deployed files
        shell: powershell
        run: |
          Write-Host "Checking deployment directory..."

          if (-not (Test-Path "C:\Deploy\ContactEmail.API")) {
              Write-Error "Deployment directory does not exist."
              exit 1
          }

          Get-ChildItem "C:\Deploy\ContactEmail.API"

      - name: Start IIS Application Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "ContactEmail.Api"

      - name: Verify IIS Application Pool
        shell: powershell
        run: |
          Write-Host "Checking IIS application pool..."
          Get-WebAppPoolState -Name "ContactEmail.Api"
